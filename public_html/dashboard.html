<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Nexus API Store</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>

  <main class="wallet-dashboard">
    <section class="wallet-hero">
      <div class="mesh-gradient" aria-hidden="true"></div>
      <div class="bg-grid" aria-hidden="true"></div>
      <div class="container wallet-hero-inner">
        <div class="wallet-hero-copy reveal">
          <span class="badge">Customer Dashboard</span>
          <h1>Welcome back! 👋 Your <span class="gradient-text">Coin Wallet</span></h1>
          <p>Recharge coins, track your usage, and access your API keys to power your projects.</p>
        </div>
        <div class="wallet-hero-visual reveal" aria-hidden="true">
          <div class="wallet-visual-glow"></div>
          <div class="wallet-visual-wallet">
            <span class="wallet-visual-body">👛</span>
            <span class="wallet-visual-coin coin-a">⚡</span>
            <span class="wallet-visual-coin coin-b">◎</span>
            <span class="wallet-visual-coin coin-c">⚡</span>
          </div>
          <div class="wallet-visual-api-card">
            <span>{ }</span>
            <strong>API</strong>
          </div>
        </div>
      </div>
    </section>

    <section class="section wallet-dashboard-section">
      <div class="container">
        <div id="dashboard-content" class="wallet-loading">Loading dashboard...</div>
      </div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/currency.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/effects.js"></script>
  <script src="/assets/js/dashboard.js"></script>
</body>
</html>
