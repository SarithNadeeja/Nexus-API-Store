<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Nexus API Store</title>
  <link rel="stylesheet" href="/assets/css/main.css">
</head>
<body>
  <header class="navbar" id="navbar"></header>
  <main class="section">
    <div class="container">
      <div class="page-header-banner" style="padding:6rem 0 2rem;text-align:left;">
        <div class="mesh-gradient" aria-hidden="true"></div>
        <div class="bg-grid" aria-hidden="true"></div>
        <div class="container" style="max-width:1280px;text-align:left;position:relative;z-index:1;">
          <span class="badge">Customer Dashboard</span>
          <h1>Your <span class="gradient-text">Coin Wallet</span></h1>
          <p>Recharge coins, track purchases, and access your API keys.</p>
        </div>
      </div>

      <div id="dashboard-content" class="muted">Loading dashboard...</div>
    </div>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/navbar.js"></script>
  <script src="/assets/js/footer.js"></script>
  <script src="/assets/js/effects.js"></script>
  <script>
    async function renderDashboard() {
      const container = document.getElementById('dashboard-content');
      if (NexusAuth.loading) return;
      if (!NexusAuth.user) {
        location.href = '/login.html';
        return;
      }

      const user = NexusAuth.user;
      container.innerHTML = `
        <div class="dashboard-grid">
          <div class="glass-card card stat"><span class="muted">Coin Balance</span><strong>${user.coinBalance}</strong></div>
          <div class="glass-card card stat"><span class="muted">Purchased APIs</span><strong>${user.purchases.length}</strong></div>
          <div class="glass-card card"><button class="btn btn-secondary" id="dash-logout" type="button">Logout</button></div>
        </div>

        <section style="margin-top:2rem;">
          <h2>Recharge Coins</h2>
          <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1rem;">
            ${[100,250,500,1000].map(amount => `<button class="btn btn-primary recharge-btn" data-coins="${amount}" type="button">${amount} coins</button>`).join('')}
          </div>
        </section>

        <div class="grid-2" style="margin-top:2rem;">
          <section class="glass-card card">
            <h2>Purchased API Keys</h2>
            ${user.purchases.length ? user.purchases.map(p => `
              <div class="list-item">
                <strong>${p.apiName}</strong> • ${p.coinsSpent} coins
                <div class="code">${p.purchasedKey}</div>
                <a href="${p.accessLink}" target="_blank" rel="noreferrer">Access Link</a>
              </div>
            `).join('') : '<p class="muted">No API purchases yet.</p>'}
          </section>
          <section class="glass-card card">
            <h2>Recent Coin Activity</h2>
            ${user.transactions.length ? user.transactions.map(tx => `
              <div class="list-item">
                <strong>${tx.description}</strong>
                <div>${tx.coinAmount >= 0 ? '+' : ''}${tx.coinAmount} coins</div>
                <div class="muted">${new Date(tx.createdAt).toLocaleString()}</div>
              </div>
            `).join('') : '<p class="muted">No coin activity yet.</p>'}
          </section>
        </div>`;

      document.getElementById('dash-logout').addEventListener('click', async () => {
        await NexusAuth.logout();
        location.href = '/';
      });

      container.querySelectorAll('.recharge-btn').forEach(btn => {
        btn.addEventListener('click', async () => {
          try {
            const session = await NexusApi.recharge(Number(btn.dataset.coins));
            NexusAuth.user = session;
            document.dispatchEvent(new CustomEvent('nexus-auth-changed'));
            renderDashboard();
          } catch (err) {
            alert(err.message);
          }
        });
      });
    }

    document.addEventListener('DOMContentLoaded', renderDashboard);
    document.addEventListener('nexus-auth-changed', renderDashboard);
  </script>
</body>
</html>
